program: training_pipeline.py
method: bayes
metric:
  name: tinyface/eval/rank@1
  goal: maximize

parameters:
  # ---- Fixed ----
  model_name:
    value: swin_base_patch4_window7_224.ms_in1k
  img_size:
    value: 96
  batch_size:
    value: 8
  max_epochs:
    value: 40
  label_smoothing:
    value: 0.0
  backbone_dropout:
    value: 0.0
  eval_on:
    value: "EVAL"
  rank_k:
    value: 5
  precision:
    value: "16-mixed"
  devices:
    value: 1
  head_type:
    value: "adaface"
  
  weight_decay:
    value: 1e-4

  lora_r:
    value: 24

  lora_alpha:
    value: 120

  lora_dropout:
    value: 0.05

  lora_qkv_proj:
    value: 1 # 0: NONE, 1: QKV, 2: PROJ, 3: BOTH

  lora_train_bias:
    value: 0 # 0: False, 1: True


  # ---- Search space ----
  lr:
    distribution: log_uniform_values
    min: 1.0e-5
    max: 5.0e-4

  head_scale:
    values: [32, 64, 80, 96]
    
  head_margin:
    distribution: uniform
    min: 0.20
    max: 0.40

  adaface_h:
    distribution: uniform
    min: 0.2
    max: 0.45

  adaface_t_alpha:
    distribution: log_uniform_values
    min: 5.0e-3
    max: 5.0e-2

command:
  - python
  - ${program}
  - ${args}
  - --no_roc
  - --no_wandb_model
  - --lora_enabled
